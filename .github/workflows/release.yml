name: Windows surumunu derle

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Bagimliliklari kur
        run: npm install

      - name: Windows exe dosyalarini uret
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Derlemeyi arsivle
        uses: actions/upload-artifact@v4
        with:
          name: moon-timer-windows
          path: dist/*.exe

      - name: Surume ekle
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
